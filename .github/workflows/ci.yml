name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Core CI skips lifecycle scripts and never prepares Electron's binary;
      # bridge helpers load without initializing the Electron runtime.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      - run: npm run test:coverage
      - run: npm run test:packages
      - name: Upload source coverage report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ runner.os }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  shell:
    name: shell (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:electron --workspace @rune/gui-shell
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke --workspace @rune/gui-shell
      - if: runner.os == 'Windows'
        run: npm run test:smoke --workspace @rune/gui-shell
      - run: npm run build:shell
      - name: Enable the Chromium user namespace sandbox on the Linux runner
        if: runner.os == 'Linux'
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:shell:package
      - if: runner.os == 'Windows'
        run: npm run test:shell:package
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:workflow:package
      - if: runner.os == 'Windows'
        run: npm run test:workflow:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui-shell-${{ runner.os }}-${{ runner.arch }}
          path: |
            output/shell/*/rune-gui-shell-*.zip
            output/shell/*/rune-gui-shell-*.tar.gz
            output/shell/*/build-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
