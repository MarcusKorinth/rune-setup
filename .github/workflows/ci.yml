name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Core CI skips lifecycle scripts and never prepares Electron's binary;
      # bridge helpers load without initializing the Electron runtime.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run depcruise
      - run: npm test
      - run: npm run test:packages

  shell:
    name: shell (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:electron --workspace @rune/gui-shell
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke --workspace @rune/gui-shell
      - if: runner.os == 'Windows'
        run: npm run test:smoke --workspace @rune/gui-shell
      - run: npm run build:shell
      - name: Enable the Chromium user namespace sandbox on the Linux runner
        if: runner.os == 'Linux'
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:shell:package
      - if: runner.os == 'Windows'
        run: npm run test:shell:package
      - uses: actions/upload-artifact@v7
        with:
          name: gui-shell-${{ runner.os }}-${{ runner.arch }}
          path: |
            output/shell/*/rune-gui-shell-*.zip
            output/shell/*/rune-gui-shell-*.tar.gz
            output/shell/*/build-metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
